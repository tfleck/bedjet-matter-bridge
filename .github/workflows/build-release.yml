name: Build, Release, and Deploy

on:
  push:
    tags:
      - 'v*'

env:
  # Enable ccache for the Matter build (the container ships it).
  IDF_CCACHE_ENABLE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.5
    # Full esp-matter build from a cold cache is slow; give it room.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Add more targets here; the web flasher picks up new firmware
          # automatically from the release assets / staged Pages copies.
          - target: esp32c6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Matter host prerequisites
        run: |
          apt-get update && apt-get install -y \
            bluez libdbus-1-dev libglib2.0-dev libical-dev \
            systemd iproute2 libpixman-1-dev pkg-config

      - name: Cache managed components and toolchain
        uses: actions/cache@v4
        with:
          path: |
            managed_components
            ~/.espressif
          key: ${{ runner.os }}-matter-managed-${{ hashFiles('**/idf_component.yml') }}
          restore-keys: |
            ${{ runner.os }}-matter-managed-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/.ccache
          key: ${{ runner.os }}-ccache-${{ matrix.target }}-${{ hashFiles('sdkconfig.defaults', 'main/idf_component.yml', 'CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.target }}-

      - name: Configure and build firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          # sdkconfig.defaults (authoritative) is applied by the project's
          # CMakeLists, which sets SDKCONFIG_DEFAULTS.
          idf.py set-target ${{ matrix.target }}
          idf.py build

      - name: Create combined firmware binary
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          TARGET="${{ matrix.target }}"
          OUTPUT="firmware_${TARGET}_combined.bin"
          # flash_args lists paths relative to build/, so merge from there.
          cd build
          python -m esptool --chip "$TARGET" merge_bin -o "$OUTPUT" @flash_args
          ls -lh "$OUTPUT"

      - name: Calculate SHA256
        shell: bash
        run: |
          cd build
          sha256sum "firmware_${{ matrix.target }}_combined.bin" > checksums.txt
          cat checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: |
            build/firmware_${{ matrix.target }}_combined.bin
            build/checksums.txt
          retention-days: 30

  aggregate-checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true

      - name: Consolidate checksums
        run: cat checksums*.txt | sort -u > checksums_final.txt

      - uses: actions/upload-artifact@v4
        with:
          name: checksums-all
          path: checksums_final.txt

  deploy-pages:
    needs: [build, aggregate-checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: web/firmware

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: checksums-all
          path: web/

      - name: Prepare web directory
        shell: bash
        run: |
          mv web/checksums_final.txt web/checksums.txt 2>/dev/null || true
          echo "=== Web directory contents ==="
          find web/ -type f -exec ls -lh {} \;
          echo "=== Web flasher ready ==="

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  create-release:
    needs: [build, aggregate-checksums, deploy-pages]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32c6

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: checksums-all

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BedJet Matter Bridge ${{ github.ref_name }}
          body: |
            ## Release: ${{ github.ref_name }}

            ### 🌐 Web Flasher
            Flash directly from your browser (Chrome, Edge, or Opera):
            **https://${{ github.repository_owner }}.github.io/bedjet-matter-bridge/**

            ### 💡 Supported chip
            | Chip | Features | Filename |
            |------|----------|----------|
            | **ESP32-C6** | Wi-Fi + BLE + Thread | `firmware_esp32c6_combined.bin` |

            ### 🔧 Manual install
            ```bash
            python -m esptool --chip esp32c6 erase_flash
            python -m esptool --chip esp32c6 write_flash 0x0 firmware_esp32c6_combined.bin
            ```
          draft: false
          prerelease: false
          files: |
            firmware_esp32c6_combined.bin
            checksums_final.txt
