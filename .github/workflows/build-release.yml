name: Build and Release

on:
  # Releases are tag-driven; the web flasher reads the release assets.
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # Enable ccache for the Matter build (the container ships it).
  IDF_CCACHE_ENABLE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.5
    # Full esp-matter build from a cold cache is slow; give it room.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Add more targets here; the web flasher lists every release that
          # carries a firmware_<target>_combined.bin asset.
          - target: esp32c6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch tags so `git describe` yields the tag as PROJECT_VER - the
          # Basic Information SoftwareVersionString Apple Home displays. The
          # default shallow checkout falls back to "1".
          fetch-depth: 0

      - name: Install Matter host prerequisites
        run: |
          apt-get update && apt-get install -y \
            bluez libdbus-1-dev libglib2.0-dev libical-dev \
            systemd iproute2 libpixman-1-dev pkg-config

      - name: Cache managed components and toolchain
        uses: actions/cache@v4
        with:
          path: |
            managed_components
            ~/.espressif
          key: ${{ runner.os }}-matter-managed-${{ hashFiles('**/idf_component.yml') }}
          restore-keys: |
            ${{ runner.os }}-matter-managed-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/.ccache
          key: ${{ runner.os }}-ccache-${{ matrix.target }}-${{ hashFiles('sdkconfig.defaults', 'main/idf_component.yml', 'CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.target }}-

      - name: Pin firmware version from tag
        shell: bash
        run: |
          # git describe fails in the container ("detected dubious ownership"),
          # so IDF falls back to PROJECT_VER=1. Pin the version explicitly.
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "${GITHUB_REF_NAME}" > version.txt
            echo "PROJECT_VER will be ${GITHUB_REF_NAME}"
          fi

      - name: Configure and build firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          # sdkconfig.defaults (authoritative) is applied by the project's
          # CMakeLists, which sets SDKCONFIG_DEFAULTS.
          idf.py set-target ${{ matrix.target }}
          idf.py build

      - name: Report firmware version
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          python -c "import json;print('PROJECT_VER =', json.load(open('build/project_description.json'))['project_version'])"

      - name: Create combined firmware binary
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          TARGET="${{ matrix.target }}"
          cd build
          python -m esptool --chip "$TARGET" merge_bin -o "firmware_${TARGET}_combined.bin" @flash_args
          ls -lh "firmware_${TARGET}_combined.bin"

      - name: Stage flashable parts and checksum
        shell: bash
        run: |
          cd build
          TARGET="${{ matrix.target }}"
          # Individual parts with the offset encoded in the filename. The web
          # flasher writes these directly, so it never touches the NVS partition.
          # (The combined image pads the gaps with 0xFF, which would erase
          # commissioning and the saved BedJet pairing.)
          rm -f part_${TARGET}_*.bin
          while read -r off file; do
            case "$file" in
              *.bin) cp "$file" "part_${TARGET}_${off}_$(basename "$file")" ;;
            esac
          done < <(grep -E '^0x[0-9a-fA-F]+[[:space:]]+.*\.bin$' flash_args)
          sha256sum "firmware_${TARGET}_combined.bin" > "firmware_${TARGET}_combined.bin.sha256"
          ls -lh part_${TARGET}_*.bin "firmware_${TARGET}_combined.bin.sha256"
          cat "firmware_${TARGET}_combined.bin.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: |
            build/firmware_${{ matrix.target }}_combined.bin
            build/firmware_${{ matrix.target }}_combined.bin.sha256
            build/part_${{ matrix.target }}_*.bin
          retention-days: 30

  create-release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true

      - name: List release files
        run: ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BedJet Matter Bridge ${{ github.ref_name }}
          body: |
            ## Release: ${{ github.ref_name }}

            ### 🌐 Web Flasher
            Flash directly from your browser (Chrome, Edge, or Opera):
            **https://${{ github.repository_owner }}.github.io/bedjet-matter-bridge/web/index.html**

            The web flasher updates in place: it writes the individual partitions
            and **does not erase NVS**, so Matter commissioning and the BedJet
            pairing survive an update.

            ### 💡 Supported chip
            | Chip | Features | Firmware | Checksum |
            |------|----------|----------|----------|
            | **ESP32-C6** | Wi-Fi + BLE + Thread | `firmware_esp32c6_combined.bin` | `firmware_esp32c6_combined.bin.sha256` |

            ### 🔧 Manual install
            The combined image is a **full install** - it overwrites NVS (Matter
            commissioning and BedJet pairing), so use it only for first-time setup.

            ```bash
            sha256sum --check firmware_esp32c6_combined.bin.sha256
            python -m esptool --chip esp32c6 erase_flash
            python -m esptool --chip esp32c6 write_flash 0x0 firmware_esp32c6_combined.bin
            ```
          draft: false
          prerelease: false
          files: |
            firmware_*_combined.bin
            firmware_*_combined.bin.sha256
            part_*.bin

  # Rebuild the flasher after the release exists. Dispatched on `main` on purpose:
  # GitHub Pages serves the deployment for the default-branch ref, so a Pages
  # deployment created at the tag ref is accepted but not served. workflow_dispatch
  # is exempt from the "GITHUB_TOKEN cannot trigger workflows" rule.
  deploy-pages:
    needs: [create-release]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger the flasher deploy on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
