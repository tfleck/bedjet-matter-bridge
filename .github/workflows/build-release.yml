name: Build, Release, and Deploy

on:
  push:
    tags:
      - 'v*'

env:
  IDF_VERSION: v5.2.2
  PROJECT_NAME: bedjet_matter_bridge

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: esp32
            name: ESP32
            flash_size: 4MB
            features: "wifi-only"
          - target: esp32s2
            name: ESP32-S2
            flash_size: 4MB
            features: "wifi-only"
          - target: esp32s3
            name: ESP32-S3
            flash_size: 8MB
            features: "wifi-plus"
          - target: esp32c3
            name: ESP32-C3
            flash_size: 4MB
            features: "wifi-efficient"
          - target: esp32c6
            name: ESP32-C6
            flash_size: 4MB
            features: "thread-enabled"
          - target: esp32h2
            name: ESP32-H2
            flash_size: 4MB
            features: "thread-only"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: ${{ matrix.target }}

      - name: Install Python dependencies
        run: pip install pyserial esptool

      - name: Configure SDK
        shell: bash
        run: |
          idf.py set-target ${{ matrix.target }}
          idf.py fullclean || true

          cat >> sdkconfig.defaults << EOF
          CONFIG_FREERTOS_HZ=1000
          CONFIG_LOG_DEFAULT_LEVEL=3
          CONFIG_ESPTOOLPY_FLASHMODE_QIO=y
          CONFIG_ESPTOOLPY_FLASHFREQ_80m=y
          CONFIG_ESPTOOLPY_BAUD_921600=y
          CONFIG_MBEDTLS_TLS_SERVER_AND_CLIENT=y
          CONFIG_PARTITION_TABLE_TWO_OTA=y
          CONFIG_SECURE_SIGNED_ON_REBOOT=n
          CONFIG_SECURE_BOOT_V2_ENABLED=n
          CONFIG_LWIP_MAX_SOCKETS=25
          CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
          CONFIG_HTTP_TRANSPORT_OVER_SSL=y
          EOF

          if [ "${{ matrix.features }}" == "thread-enabled" ] || [ "${{ matrix.features }}" == "thread-only" ]; then
            cat >> sdkconfig.defaults << EOF
            CONFIG_OPENTHREAD_ENABLED=y
            CONFIG_ENABLE_THREAD_NETWORK=y
            CONFIG_MATTER_USE_6LOWPAN=y
            EOF
          fi

          if [ "${{ matrix.flash_size }}" == "8MB" ]; then
            echo 'CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y' >> sdkconfig.defaults
          else
            echo 'CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y' >> sdkconfig.defaults
          fi

      - name: Build firmware
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          sed -i "s/#define APP_VERSION.*/#define APP_VERSION \"$VERSION\"/" main/main.cpp
          idf.py build

      - name: Create combined firmware binary
        shell: bash
        run: |
          TARGET=${{ matrix.target }}
          BIN_FILE="${{ env.PROJECT_NAME }}.bin"
          OUTPUT="firmware_${TARGET}_combined.bin"

          esptool.py --chip $TARGET merge_bin \
            -o build/$OUTPUT \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size detect \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0xe000 build/$BIN_FILE

          ls -lh build/*.bin

      - name: Calculate SHA256
        shell: bash
        run: |
          FILENAME="firmware_${{ matrix.target }}_combined.bin"
          HASH=$(sha256sum build/$FILENAME | cut -d' ' -f1)
          echo "$HASH  $FILENAME" >> build/checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: |
            build/firmware_${{ matrix.target }}_combined.bin
            build/checksums.txt
          retention-days: 30

  aggregate-checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true

      - name: Consolidate checksums
        run: cat checksums*.txt | sort -u > checksums_final.txt

      - uses: actions/upload-artifact@v4
        with:
          name: checksums-all
          path: checksums_final.txt

  deploy-pages:
    needs: [build, aggregate-checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: web/firmware

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: checksums-all
          path: web/

      - name: Prepare web directory
        shell: bash
        run: |
          mv web/checksums_final.txt web/checksums.txt 2>/dev/null || true
          echo "=== Web directory contents ==="
          find web/ -type f -exec ls -lh {} \;
          echo "=== Web flasher ready ==="

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  create-release:
    needs: [build, aggregate-checksums, deploy-pages]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: checksums-all

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BedJet Matter Bridge ${{ github.ref_name }}
          body: |
            ## Release: ${{ github.ref_name }}

            ### 🌐 Web Flasher
            Flash directly from your browser:
            **https://${{ github.repository_owner }}.github.io/bedjet-matter-bridge/**

            ### 💡 Supported Chips
            | Chip | Features | Filename |
            |------|----------|----------|
            | **ESP32-C6** ⭐ | Wi-Fi + BLE + Thread | `firmware_esp32c6_combined.bin` |
            | ESP32-S3 | Wi-Fi + BLE | `firmware_esp32s3_combined.bin` |
            | ESP32 | Wi-Fi + BLE | `firmware_esp32_combined.bin` |
            | ESP32-C3 | Wi-Fi + BLE (RISC-V) | `firmware_esp32c3_combined.bin` |
            | ESP32-S2 | Wi-Fi + BLE + USB | `firmware_esp32s2_combined.bin` |
            | ESP32-H2 | BLE + Thread only | `firmware_esp32h2_combined.bin` |

            ### 🔧 Manual Install
            ```bash
            esptool.py --chip <CHIP> erase_flash
            esptool.py --chip <CHIP> write_flash 0x0 firmware_<CHIP>_combined.bin
            ```
          draft: false
          prerelease: false
          files: |
            firmware_esp32_combined.bin
            firmware_esp32s2_combined.bin
            firmware_esp32s3_combined.bin
            firmware_esp32c3_combined.bin
            firmware_esp32c6_combined.bin
            firmware_esp32h2_combined.bin
            checksums_final.txt
